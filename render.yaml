# Render Blueprint untuk deploy Backend API (opsional; bisa juga dibuat manual lewat dashboard Render)
services:
  - type: web
    name: lnt-camp-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
